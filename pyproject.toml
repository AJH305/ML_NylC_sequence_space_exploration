[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ml-nylc"
version = "0.1.0"
description = "Reproducible NylC activity modelling with Epistatic GP and calibrated DPP selection"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3", "pandas>=2.2,<4", "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2", "matplotlib>=3.10,<4", "peptides==0.5.0",
  "biopython>=1.85,<2", "pyyaml>=6,<7", "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
tabicl = ["tabicl==2.0.3"]
protein = ["torch>=2.6,<3", "transformers>=4.48,<5"]
metl = ["torch>=2.6,<3", "metl-pretrained @ git+https://github.com/gitter-lab/metl-pretrained.git@52358614c4b412e81e19e300485e8b85123bd903"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
workflow = ["snakemake>=9,<10; sys_platform != 'win32'", "snakemake-executor-plugin-slurm>=1,<3; sys_platform == 'linux'"]

[project.scripts]
nylc = "nylc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nylc"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: complete small pipeline", "reference: comparisons with archived numerical reference"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]
