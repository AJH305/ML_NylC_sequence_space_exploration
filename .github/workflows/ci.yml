name: Reproducibility checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests tools
      - run: uv run --no-sync pytest -q
      - if: runner.os == 'Linux'
        run: uv sync --locked --group workflow
      - if: runner.os == 'Linux'
        run: uv run --no-sync snakemake --snakefile workflow/Snakefile --cores 2 --config experiment_config=configs/smoke-linux.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results-${{ matrix.os }}
          path: results/
